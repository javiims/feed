name: Update RSS Feed

on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:
    inputs:
      mode:
        description: 'build = update feed | inspect = list DB fields | latest = last 50 rows'
        type: choice
        options: [build, inspect, latest]
        default: build

permissions:
  contents: write            # required for the push with GITHUB_TOKEN

concurrency:
  group: update-rss
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Inspect database (manual only)
        if: ${{ github.event.inputs.mode == 'inspect' }}
        run: python main.py --inspect

      - name: Show latest rows (manual only)
        if: ${{ github.event.inputs.mode == 'latest' }}
        run: python main.py --latest 50

      - name: Run scraper
        if: ${{ github.event.inputs.mode != 'inspect' && github.event.inputs.mode != 'latest' }}
        run: python main.py

      - name: Commit and push changes
        if: ${{ github.event.inputs.mode != 'inspect' && github.event.inputs.mode != 'latest' }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add amc_animacion.xml seen_ids.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Auto-update RSS feed"
          git pull --rebase
          git push
